name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Ensure vendored upstream copilot-stats at pinned commit
        run: |
          # If the vendor directory is missing or incomplete, clone a fresh copy
          rm -rf vendor/copilot-stats
          git clone --depth=1 https://github.com/nilcaream/copilot-stats.git vendor/copilot-stats
          # Pin to a specific upstream commit to ensure deterministic CI
          git -C vendor/copilot-stats checkout 1f8b031
          ACTUAL=$(git -C vendor/copilot-stats rev-parse --short HEAD)
          echo "Pinned upstream commit: $ACTUAL"
          if [ "$ACTUAL" != "1f8b031" ]; then echo "Unexpected upstream commit" && exit 1; fi
      - name: Run tests
        run: npm test
      - name: Verify licensing provenance
        run: |
          test -f vendor/copilot-stats/LICENSE
          sed -n '1,20p' vendor/copilot-stats/LICENSE
