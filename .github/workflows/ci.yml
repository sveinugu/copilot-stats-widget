name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Ensure vendored upstream copilot-stats at pinned commit
        # We must fetch the exact commit SHA to avoid failures from shallow clones.
        # Approach: clone and then fetch the specific commit depth=1 to guarantee the SHA is available,
        # then check it out. This avoids relying on the remote branch tip to contain the pinned SHA.
        run: |
          # Ensure a clean vendor directory to avoid CI flakes from partial/dirty clones
          rm -rf vendor/copilot-stats
          mkdir -p vendor
          git clone https://github.com/nilcaream/copilot-stats.git vendor/copilot-stats
          # Fetch only the exact commit we need to keep network transfer small and deterministic
          git -C vendor/copilot-stats fetch --depth=1 origin 1f8b031
          git -C vendor/copilot-stats checkout 1f8b031
          ACTUAL=$(git -C vendor/copilot-stats rev-parse --short HEAD)
          echo "Pinned upstream commit: $ACTUAL"
          if [ "$ACTUAL" != "1f8b031" ]; then echo "Unexpected upstream commit" && exit 1; fi
      - name: Run tests
        run: npm test
      - name: Verify licensing provenance
        run: |
          test -f vendor/copilot-stats/LICENSE
          sed -n '1,20p' vendor/copilot-stats/LICENSE
