name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Vendor upstream copilot-stats (if missing)
        run: |
          if [ ! -d "vendor/copilot-stats" ]; then
            git clone --depth=1 https://github.com/nilcaream/copilot-stats.git vendor/copilot-stats
          fi
      - name: Run tests
        run: npm test
      - name: Verify licensing provenance
        run: |
          test -f vendor/copilot-stats/LICENSE
          sed -n '1,20p' vendor/copilot-stats/LICENSE
